<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>VeriPen 控制台（只读）</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; }
  header { padding: 12px 16px; border-bottom: 1px solid #8884; display: flex; gap: 12px; align-items: center; }
  header .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #8882; }
  nav { display: flex; gap: 4px; padding: 8px 16px; border-bottom: 1px solid #8884; flex-wrap: wrap; }
  nav button { border: 1px solid transparent; background: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
  nav button[aria-current="page"] { background: #8882; border-color: #8884; }
  main { padding: 16px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #8883; }
  th[data-sort] { cursor: pointer; user-select: none; }
  .sev-critical { color: #b00; font-weight: 600; }
  .sev-high { color: #d33; }
  .sev-low, .sev-info { color: #666; }
  .weak { color: #a60; }
  .alert-red { background: #fdd; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-weight: 600; }
  .alert-warn { background: #ffe9b3; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { border: 1px solid #8884; border-radius: 8px; padding: 12px; }
  .card h2 { font-size: 13px; margin: 0 0 8px; color: #888; font-weight: 600; }
  .card .big { font-size: 24px; font-weight: 600; }
  .card a[data-drill] { color: inherit; text-decoration: underline dotted; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid #8886; font-size: 12px; margin: 0 4px 4px 0; }
  .cell-verified { color: #b00; font-weight: 600; }
  .cell-blocked { color: #555; text-decoration: line-through; }
  .cell-not_run { color: #999; }
  .muted { color: #888; font-size: 12px; }
  pre { background: #8881; padding: 12px; border-radius: 6px; overflow: auto; }
</style>
</head>
<body>
<header>
  <strong>VeriPen</strong>
  <span class="badge">只读</span>
  <span class="muted">控制台是「看和审」，不是「改」</span>
</header>
<nav id="nav"></nav>
<main id="main"><p class="muted">加载中…</p></main>
<script>
// 页面清单由后端 op 表给出——前端不写死任何页面路径（27 §6）
const OPS = ["overview","engagement","findings","finding","unverified","coverage","routes","audit","bounds"];
let current = "findings";

function el(tag, attrs = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v; else node.setAttribute(k, v);
  }
  for (const kid of kids) {
    node.append(typeof kid === "string" ? document.createTextNode(kid) : kid);
  }
  return node;
}

async function fetchOp(name) {
  const res = await fetch("../../ui/" + name, { headers: { accept: "application/json" } });
  if (!res.ok) return { error: res.status };
  const body = await res.json();
  return body.data;
}

function renderFindings(data) {
  if (!data.rows) return el("p", {}, "无数据");
  const wrap = el("div");
  const unv = data.unverified || 0;
  wrap.append(el("p", { class: "muted" },
    `共 ${data.total} 条 · 已确认 ${data.shown} 条 · 折叠 ${data.collapsed_low} 条低优先`
    + (unv ? ` · 未验证 ${unv} 条（见「unverified」页）` : "")));
  const table = el("table");
  const head = el("tr",
    ...["严重度","oracle","资产","置信度","证据强度","面","replay","优先级","命中"]
      .map((h) => el("th", {}, h)));
  table.append(head);
  for (const row of data.rows) {
    const tr = el("tr");
    // severity 只为已验证行输出；未验证行不得长得像漏洞（D1 / A13）
    tr.append(row.severity
      ? el("td", { class: "sev-" + row.severity }, row.severity)
      : el("td", { class: "muted" }, "—"));
    tr.append(el("td", {}, row.oracle));
    tr.append(el("td", {}, row.asset));
    tr.append(el("td", {}, row.confidence.toFixed(2)));
    tr.append(el("td", { class: row.evidenceStrength === "probe" || row.evidenceStrength === "crawl" ? "weak" : "" },
      row.evidenceStrength));
    tr.append(row.bound === false
      ? el("td", { class: "muted" }, "未绑定")
      : el("td", {}, row.route));
    tr.append(el("td", {}, row.replay));
    tr.append(el("td", {}, row.priority.toFixed(1)));
    // 命中四态：0 / 1 / N 处 / 未执行 —— 空白是缺陷，不是简约
    const HITS = { zero: "0", single: "1", multi: `合并 ${row.hits} 处`, not_run: "未执行" };
    tr.append(el("td", { class: row.hits_state === "zero" || row.hits_state === "not_run" ? "muted" : "" },
      HITS[row.hits_state] ?? ""));
    table.append(tr);
  }
  wrap.append(table);
  return wrap;
}

function renderRoutes(data) {
  const wrap = el("div");
  wrap.append(el("p", { class: "muted" },
    `绑定 ${data.count} 条 · 模板可见：${data.template_visible ? "是" : "否（只给摘要）"}`));
  const table = el("table",
    el("tr", ...["ref(前24)","标签","来源","置信档","TTL"].map((h) => el("th", {}, h))));
  for (const b of data.bindings) {
    table.append(el("tr",
      el("td", {}, b.ref), el("td", {}, (b.tags || []).join(", ")),
      el("td", {}, String(b.source)), el("td", {}, String(b.confidence)),
      el("td", {}, String(b.ttl_s))));
  }
  wrap.append(table);
  return wrap;
}

function renderBounds(data) {
  const wrap = el("div");
  if (data.alert === "red") {
    wrap.append(el("div", { class: "alert-red" }, `越界事件 ${data.count} 次 —— 这是事故，不是统计`));
  } else {
    wrap.append(el("p", { class: "muted" }, "越界事件：0（正常）"));
  }
  if (data.events && data.events.length) {
    wrap.append(el("pre", {}, JSON.stringify(data.events, null, 2)));
  }
  return wrap;
}

function renderGeneric(data) {
  return el("pre", {}, JSON.stringify(data, null, 2));
}

function card(title, ...kids) {
  return el("section", { class: "card" }, el("h2", {}, title), ...kids);
}

const COVERAGE_LABEL = {
  verified: "已确认", blocked: "阻塞", inconclusive: "未确认", not_run: "未测", error: "错误",
};

function renderOverview(d) {
  const eng = (d.engagements && d.engagements[0]) || {};
  const cov = d.coverage || { tested: 0, total: 1, zero_hit_tags: [] };
  const rate = cov.total ? cov.tested / cov.total : 0;
  const wrap = el("div");

  // 覆盖不足必须喊出来：结论只在这些面上成立（D1 的界面化）
  if (rate < 0.5) {
    wrap.append(el("div", { class: "alert-warn" },
      `覆盖率 ${cov.tested}/${cov.total} —— 本轮结论只在这些面上成立，其余为未测`));
  }

  wrap.append(el("div", { class: "cards" },
    card("资产与范围",
      el("p", { class: "big" }, String(eng.asset || "（无数据）")),
      el("p", { class: "muted" }, String(eng.scope || "")),
      el("p", { class: "muted" }, `engagement ${String(eng.id || "-")}`)),
    card("结论计数",
      el("p", { class: "big" },
        el("a", { href: "#/findings", "data-drill": "findings" }, String(d.findings ?? 0))),
      el("p", { class: "muted" }, "条（其中已确认见 findings）"),
      el("p", {},
        el("a", { href: "#/unverified", "data-drill": "unverified" },
          `未验证 ${d.unverified ?? 0} 条`),
        " ",
        el("span", { class: "muted" },
          `立即看 ${(d.queues || {}).now ?? 0} · 本周 ${(d.queues || {}).week ?? 0}`))),
    card("覆盖缺口",
      el("p", { class: "big" },
        el("a", { href: "#/coverage", "data-drill": "coverage" },
          `${cov.tested}/${cov.total}`)),
      el("p", { class: "muted" },
        (cov.zero_hit_tags || []).length
          ? `零命中标签：${(cov.zero_hit_tags || []).join(", ")}`
          : "零命中标签：无"))));

  return wrap;
}

function renderEngagement(d) {
  const rows = [
    ["engagement", d.id], ["资产", d.asset], ["范围", d.scope],
    ["已确认", d.confirmed], ["总条目", d.total],
    ["决策", d.decision], ["原因", d.reason], ["绑定数", d.bindings],
  ];
  const table = el("table");
  for (const [k, v] of rows) {
    table.append(el("tr", el("th", { scope: "row" }, k),
      el("td", {}, v === undefined || v === null || v === "" ? "未提供" : String(v))));
  }
  return table;
}

function renderCoverage(d) {
  const wrap = el("div");
  wrap.append(el("p", { class: "muted" },
    `口径：${d.scope || "unknown"}（分母只含跑过的面）`));
  if (!(d.matrix || []).length) {
    wrap.append(el("p", {}, "本轮没有可展示的覆盖数据"));
    return wrap;
  }
  const table = el("table");
  const head = el("tr", el("th", {}, "资产"), ...(d.oracles || []).map((o) => el("th", {}, o)));
  table.append(head);
  for (const row of d.matrix) {
    const tr = el("tr", el("td", {}, row.asset));
    for (const o of d.oracles || []) {
      const state = row.cells[o] || "not_run";
      tr.append(el("td", { class: "cell-" + state }, COVERAGE_LABEL[state] || state));
    }
    table.append(tr);
  }
  wrap.append(table);
  if ((d.zero_hit_tags || []).length) {
    wrap.append(el("p", { class: "muted" },
      ...["零命中标签：", ...d.zero_hit_tags.map((x) => el("span", { class: "chip" }, x))]));
  }
  return wrap;
}

async function show(op) {
  current = op;
  for (const btn of document.querySelectorAll("#nav button")) {
    btn.setAttribute("aria-current", btn.dataset.op === op ? "page" : "false");
  }
  const main = document.getElementById("main");
  main.replaceChildren(el("p", { class: "muted" }, "加载中…"));
  const data = await fetchOp(op);
  let view;
  if (op === "overview") view = renderOverview(data);
  else if (op === "engagement") view = renderEngagement(data);
  else if (op === "coverage") view = renderCoverage(data);
  else if (op === "findings") view = renderFindings(data);
  else if (op === "routes") view = renderRoutes(data);
  else if (op === "bounds") view = renderBounds(data);
  else view = renderGeneric(data);
  main.replaceChildren(view);
}

const nav = document.getElementById("nav");
for (const op of OPS) {
  const btn = el("button", { "data-op": op }, op);
  btn.addEventListener("click", () => show(op));
  nav.append(btn);
}
document.querySelector(`#nav button[data-op="${current}"]`)?.click();
</script>
</body>
</html>
