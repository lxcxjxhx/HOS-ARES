<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>VeriPen 控制台（只读）</title>
<style>
  /* ── 设计令牌（B41）：所有颜色/间距/字号只在这里定义，别处一律 var() ── */
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #14161a;
    --muted: #565f6b;
    --line: #d5d9df;
    --surface: #f6f7f9;
    --danger: #a11226;
    --danger-bg: #fde8e8;
    --warn-bg: #fff4cc;
    --weak: #7a5200;
    --accent: #1a56a8;
    --focus: #1a56a8;
    --radius: 8px;
    --radius-sm: 6px;
    --pad: 16px;
    --row-pad: 6px;
    --fs: 14px;
    --fs-sm: 12px;
    --fs-lg: 24px;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    /* 打印固定黑白（不跟随主题），同样是令牌，规则里不写色号 */
    --print-bg: #ffffff;
    --print-fg: #000000;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #e9ecf1;
      --muted: #a8b0bb;
      --line: #333941;
      --surface: #1c2026;
      --danger: #ff8a8a;
      --danger-bg: #3a1d1d;
      --warn-bg: #3a3116;
      --weak: #e8bf63;
      --accent: #8ab6ff;
      --focus: #8ab6ff;
    }
  }
  /* 密度：舒适 / 紧凑（偏好存 localStorage，只影响本地视图） */
  body[data-density="compact"] { --pad: 10px; --row-pad: 3px; --fs-sm: 11px; }

  body { font: var(--fs)/1.5 var(--font); margin: 0; background: var(--bg); color: var(--fg); }
  .skip { position: absolute; left: -999px; top: 0; padding: 8px 12px; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: var(--radius-sm); z-index: 10; }
  .skip:focus { left: 8px; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  header { padding: 12px var(--pad); border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; }
  header .badge { font-size: var(--fs-sm); padding: 2px 8px; border-radius: 999px; background: var(--surface); }
  nav { display: flex; gap: 4px; padding: 8px var(--pad); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  nav button { border: 1px solid transparent; background: none; color: inherit; padding: 4px 10px; border-radius: var(--radius-sm); cursor: pointer; font: inherit; }
  nav button[aria-current="page"] { background: var(--surface); border-color: var(--line); }
  main { padding: var(--pad); }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: var(--row-pad) 8px; border-bottom: 1px solid var(--line); }
  tr:focus-visible, tr[data-active="1"] { outline: 2px solid var(--focus); outline-offset: -2px; }
  .sev-critical { color: var(--danger); font-weight: 600; }
  .sev-high { color: var(--danger); }
  .sev-low, .sev-info { color: var(--muted); }
  .weak { color: var(--weak); }
  .alert-red { background: var(--danger-bg); color: var(--danger); padding: 8px 12px; border-radius: var(--radius-sm); margin-bottom: 12px; font-weight: 600; }
  .alert-warn { background: var(--warn-bg); padding: 8px 12px; border-radius: var(--radius-sm); margin-bottom: 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: var(--pad); }
  .card { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; background: var(--surface); }
  .card h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  .card .big { font-size: var(--fs-lg); font-weight: 600; }
  .card a[data-drill] { color: inherit; text-decoration: underline dotted; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: var(--fs-sm); margin: 0 4px 4px 0; }
  .cell-verified { color: var(--danger); font-weight: 600; }
  .cell-blocked { color: var(--muted); text-decoration: line-through; }
  .cell-not_run { color: var(--muted); }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar input, .toolbar select { padding: 4px 8px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--bg); color: inherit; font: inherit; }
  .toolbar .hint { color: var(--muted); font-size: var(--fs-sm); }
  .muted { color: var(--muted); font-size: var(--fs-sm); }
  pre { background: var(--surface); padding: 12px; border-radius: var(--radius-sm); overflow: auto; }
  .skeleton { height: 1em; border-radius: 4px; background: var(--surface); margin: 6px 0; }
  .state-error { border: 1px solid var(--danger); border-radius: var(--radius); padding: 12px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  @media print {
    header, nav, .toolbar, .skip { display: none; }
    tr { break-inside: avoid; }
    thead { display: table-header-group; }
    main { padding: 0; }
    table { font-size: 11px; }
    body { background: var(--print-bg); color: var(--print-fg); }
  }
</style>
</head>
<body>
<a class="skip" href="#main">跳到主内容</a>
<header>
  <strong>VeriPen</strong>
  <span class="badge">只读</span>
  <span class="muted">控制台是「看和审」，不是「改」</span>
  <button id="density" type="button" aria-pressed="false">密度：舒适</button>
</header>
<nav id="nav" aria-label="页面"></nav>
<main id="main" tabindex="-1" aria-live="polite"><p class="muted" role="status">加载中…</p></main>
<script type="module">
// 页面清单、URL 状态、筛选排序全部来自 router.js（纯函数，可 node 测试）
import { OPS, DEFAULT_SORT, parseHash, buildHash, isRouteHash, viewRows } from "./router.js?v=2";

const main = document.getElementById("main");
const nav = document.getElementById("nav");

// 启动期异常必须可见：否则页面停在「加载中」，而没人知道为什么
window.addEventListener("error", (event) => {
  main.setAttribute("aria-busy", "false");
  main.replaceChildren(renderError("启动", event.message || "脚本错误"));
});
let state = parseHash(location.hash);
let lastRows = [];

function el(tag, attrs = {}, ...kids) {
  // 第二个参数是属性表或第一个子节点：`el("tr", th1, th2)` 这种写法必须成立，
  // 否则第一个 th 会被当成 attrs 吞掉（曾导致表头少一列）。
  if (attrs === null || typeof attrs !== "object" || Array.isArray(attrs)
      || typeof attrs.nodeType === "number") {
    kids.unshift(attrs);
    attrs = {};
  }
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v; else node.setAttribute(k, v);
  }
  for (const kid of kids) {
    if (kid === null || kid === undefined) continue;
    node.append(typeof kid === "string" ? document.createTextNode(kid) : kid);
  }
  return node;
}

//: 后端接受的查询参数（只这些，不转发整个 hash —— 前端不是代理）
const QUERY = { findings: ["low"], finding: ["id"] };

async function fetchOp(name, params = {}) {
  const allowed = QUERY[name] || [];
  const qs = new URLSearchParams();
  for (const key of allowed) {
    const value = params[key];
    if (value !== undefined && value !== "") qs.set(key, value);
  }
  const suffix = qs.toString() ? "?" + qs.toString() : "";
  const res = await fetch("../../ui/" + name + suffix, { headers: { accept: "application/json" } });
  if (!res.ok) return { error: res.status };
  const body = await res.json();
  return body.data;
}

function card(title, ...kids) {
  return el("section", { class: "card" }, el("h2", {}, title), ...kids);
}

const COVERAGE_LABEL = {
  verified: "已确认", blocked: "阻塞", inconclusive: "未确认", not_run: "未测", error: "错误",
};

const HITS = { zero: "0", single: "1", multi: "多处（已合并）", not_run: "未执行" };

const VERDICT_LABEL = {
  inconclusive: "未确认", blocked: "阻塞", not_run: "未执行", error: "错误",
};

const VERDICT_FIX = {
  inconclusive: "三向对照未成立：换载荷或复核基线",
  blocked: "补输入：凭据 / OOB 域名 / 放行限速",
  not_run: "本轮未覆盖（预算或标签缺失）",
  error: "环境错误：重跑或查网络",
};

function renderFindings(data, params) {
  const wrap = el("div");
  const unv = data.unverified || 0;
  const rows = viewRows(data.rows || [], params || {});

  const search = el("input", {
    type: "search", id: "q", placeholder: "搜索 title / oracle / 资产（/ 聚焦）",
    "aria-label": "搜索发现", value: params?.q || "",
  });
  const sev = el("select", { id: "sev", "aria-label": "严重度" },
    el("option", { value: "" }, "全部严重度"),
    ...["critical", "high", "medium", "low", "info"].map((s) =>
      el("option", { value: s }, s)));

  const toolbar = el("div", { class: "toolbar" },
    search, sev,
    el("span", { class: "hint" }, "j / k 移动 · Enter 打开 · Esc 返回"),
    el("span", { class: "muted" },
      `共 ${data.total} 条 · 已确认 ${data.shown} 条 · 本页 ${rows.length} 条`
      + (unv ? ` · 未验证 ${unv} 条` : "")));
  wrap.append(toolbar);

  if (!rows.length) {
    wrap.append(el("p", { role: "status" }, "没有匹配的已确认结论"));
  } else {
    const table = el("table", { "aria-label": "已确认发现" });
    table.append(el("tr",
      ...["严重度", "oracle", "资产", "置信度", "证据强度", "面", "replay", "优先级", "命中"]
        .map((h) => el("th", {}, h))));
    for (const row of rows) {
      const tr = el("tr", { tabindex: "0", "data-id": row.id, "data-active": "0" });
      tr.append(row.severity
        ? el("td", { class: "sev-" + row.severity }, row.severity)
        : el("td", { class: "muted" }, "—"));
      tr.append(el("td", {}, row.oracle));
      tr.append(el("td", {}, row.asset));
      tr.append(el("td", {}, Number(row.confidence || 0).toFixed(2)));
      tr.append(el("td", { class: row.evidenceStrength === "probe" || row.evidenceStrength === "crawl" ? "weak" : "" },
        row.evidenceStrength));
      tr.append(row.bound === false
        ? el("td", { class: "muted" }, "未绑定")
        : el("td", {}, row.route));
      tr.append(el("td", {}, row.replay));
      tr.append(el("td", {}, Number(row.priority || 0).toFixed(1)));
      tr.append(el("td", { class: row.hits_state === "zero" || row.hits_state === "not_run" ? "muted" : "" },
        HITS[row.hits_state] ?? ""));
      table.append(tr);
    }
    wrap.append(table);
  }

  search.value = params?.q || "";
  sev.value = params?.sev || "";
  search.addEventListener("input", () => setHash({ op: "findings", params: { ...(state.params || {}), q: search.value, sev: sev.value } }));
  sev.addEventListener("change", () => setHash({ op: "findings", params: { ...(state.params || {}), sev: sev.value, q: search.value } }));
  return wrap;
}

function renderUnverified(data) {
  const wrap = el("div");
  const counts = data.by_verdict_counts || {};
  const groups = data.by_verdict || {};
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  wrap.append(el("p", { class: "muted" },
    `未验证 ${total} 条 —— 缺输入不是没漏洞（D1）；每条都写清"补什么能测"`));
  for (const key of Object.keys(VERDICT_LABEL)) {
    const ids = groups[key] || [];
    wrap.append(el("h2", {}, `${VERDICT_LABEL[key]} · ${ids.length}`));
    if (!ids.length) {
      wrap.append(el("p", { class: "muted" }, "（无）"));
      continue;
    }
    const table = el("table", { "aria-label": VERDICT_LABEL[key] });
    table.append(el("tr", el("th", {}, "结论"), el("th", {}, "oracle"), el("th", {}, "原因"), el("th", {}, "补什么能测")));
    // 未验证行不在 findings 载荷里，用本页 entries（B39：blocked 在旧三组中没有位置）
    const entries = (data.entries || []).filter((e) => ids.includes(e.id));
    for (const e of entries) {
      table.append(el("tr", el("td", {}, e.id), el("td", {}, e.oracle),
        el("td", {}, e.reason), el("td", { class: "muted" }, VERDICT_FIX[key] || "-")));
    }
    wrap.append(table);
  }
  return wrap;
}

function renderOverview(d) {
  const eng = (d.engagements && d.engagements[0]) || {};
  const cov = d.coverage || { tested: 0, total: 1, zero_hit_tags: [] };
  const rate = cov.total ? cov.tested / cov.total : 0;
  const wrap = el("div");

  if (rate < 0.5) {
    wrap.append(el("div", { class: "alert-warn" },
      `覆盖率 ${cov.tested}/${cov.total} —— 本轮结论只在这些面上成立，其余为未测`));
  }

  wrap.append(el("div", { class: "cards" },
    card("资产与范围",
      el("p", { class: "big" }, String(eng.asset || "（无数据）")),
      el("p", { class: "muted" }, String(eng.scope || "")),
      el("p", { class: "muted" }, `engagement ${String(eng.id || "-")}`)),
    card("结论计数",
      el("p", { class: "big" },
        el("a", { href: "#/findings", "data-drill": "findings" }, String(d.findings ?? 0))),
      el("p", { class: "muted" }, "条（其中已确认见 findings）"),
      el("p", {},
        el("a", { href: "#/unverified", "data-drill": "unverified" }, `未验证 ${d.unverified ?? 0} 条`),
        " ",
        el("span", { class: "muted" }, `立即看 ${(d.queues || {}).now ?? 0} · 本周 ${(d.queues || {}).week ?? 0}`))),
    card("覆盖缺口",
      el("p", { class: "big" },
        el("a", { href: "#/coverage", "data-drill": "coverage" }, `${cov.tested}/${cov.total}`)),
      el("p", { class: "muted" },
        (cov.zero_hit_tags || []).length ? `零命中标签：${(cov.zero_hit_tags || []).join(", ")}` : "零命中标签：无"))));

  // B161：模型自述单独一块，**标清不计入判定**——它是"模型自己怎么说"，
  // 结论仍只认 findings。没有自述（无模型/未 finish）就不显示这一块。
  const claim = d.agent_claim || {};
  const unresolved = claim.unresolved || [];
  if (claim.summary || unresolved.length) {
    wrap.append(card("本轮模型自述（不计入判定）",
      el("p", {}, String(claim.summary || "（未提供）")),
      el("p", { class: "muted" },
        unresolved.length ? `自述未解决：${unresolved.join("、")}` : "自述未解决：无")));
  }

  return wrap;
}

function renderEngagement(d) {
  const rows = [
    ["engagement", d.id], ["资产", d.asset], ["范围", d.scope],
    ["已确认", d.confirmed], ["总条目", d.total],
    ["决策", d.decision], ["原因", d.reason], ["绑定数", d.bindings],
  ];
  const table = el("table");
  for (const [k, v] of rows) {
    table.append(el("tr", el("th", { scope: "row" }, k),
      el("td", {}, v === undefined || v === null || v === "" ? "未提供" : String(v))));
  }
  return table;
}

function renderCoverage(d) {
  const wrap = el("div");
  wrap.append(el("p", { class: "muted" }, `口径：${d.scope || "unknown"}（分母只含跑过的面）`));
  // B97：有账本就先把"哪条面根本没判定"摆出来——它比矩阵更接近客户问的那个问题。
  if (d.ledger) {
    const L = d.ledger;
    const s = L.summary || {};
    const done = (L.completeness || {}).complete;
    wrap.append(el("p", {},
      `账本：面 ${s.faces || 0}（有判定 ${s.faces_covered || 0}）· 适用 ${s.applicable_pairs || 0} 对`
      + ` · 执行 ${s.executed || 0} · 缺口 ${s.gaps || 0} · 完整：${done ? "是" : "否"}`));
    // 账本里的话是给 markdown 报告写的，控制台是纯文本：把 **强调** 去掉再显示
    const plain = (s0) => String(s0).replace(/\*\*/g, "");
    for (const c of ((L.completeness || {}).caveats || [])) {
      wrap.append(el("p", { class: "muted" }, plain(c)));
    }
    const gaps = L.gaps || [];
    if (gaps.length) {
      const t = el("table");
      t.append(el("tr", ...["缺口", "严重度", "说明"].map((h) => el("th", {}, h))));
      for (const g of gaps) {
        t.append(el("tr", el("td", {}, String(g.kind)),
          el("td", {}, String(g.severity)), el("td", {}, plain(g.detail || ""))));
      }
      wrap.append(t);
    }
  }
  if (!(d.matrix || []).length) {
    wrap.append(el("p", { role: "status" }, "本轮没有可展示的覆盖数据"));
    return wrap;
  }
  const table = el("table");
  table.append(el("tr", el("th", {}, "资产"), ...(d.oracles || []).map((o) => el("th", {}, o))));
  for (const row of d.matrix) {
    const tr = el("tr", el("td", {}, row.asset));
    for (const o of d.oracles || []) {
      const st = row.cells[o] || "not_run";
      tr.append(el("td", { class: "cell-" + st }, COVERAGE_LABEL[st] || st));
    }
    table.append(tr);
  }
  wrap.append(table);
  if ((d.zero_hit_tags || []).length) {
    wrap.append(el("p", { class: "muted" },
      ...["零命中标签：", ...d.zero_hit_tags.map((x) => el("span", { class: "chip" }, x))]));
  }
  return wrap;
}

function renderRoutes(data) {
  const wrap = el("div");
  wrap.append(el("p", { class: "muted" },
    `绑定 ${data.count} 条 · 模板可见：${data.template_visible ? "是" : "否（只给摘要）"}`));
  const table = el("table");
  table.append(el("tr", ...["ref(前24)", "标签", "来源", "置信档", "TTL"].map((h) => el("th", {}, h))));
  for (const b of data.bindings) {
    table.append(el("tr", el("td", {}, b.ref), el("td", {}, (b.tags || []).join(", ")),
      el("td", {}, String(b.source)), el("td", {}, String(b.confidence)), el("td", {}, String(b.ttl_s))));
  }
  wrap.append(table);
  return wrap;
}

function renderAudit(data) {
  const wrap = el("div");
  if (!data.count) {
    wrap.append(el("p", { class: "muted" },
      data.source === "unavailable"
        ? "没有事件源：用 --db 指向事件库后此页才有内容（空表不冒充正常）"
        : "事件库为空"));
    return wrap;
  }
  wrap.append(el("p", { class: "muted" },
    `事件 ${data.count} 条 · 只读 · 来源 ${data.source}`));
  const table = el("table");
  table.append(el("tr", ...["时间", "谁", "做了什么", "对象", "结果"].map((h) => el("th", {}, h))));
  for (const e of data.events) {
    table.append(el("tr",
      el("td", {}, String(e.at)),
      el("td", {}, String(e.who)),
      el("td", {}, String(e.what)),
      el("td", {}, String(e.asset)),
      el("td", {}, e.ok ? "ok" : "失败")));
  }
  wrap.append(table);
  return wrap;
}

function renderBounds(data) {
  const wrap = el("div");
  if (data.alert === "red") {
    wrap.append(el("div", { class: "alert-red" }, `越界事件 ${data.count} 次 —— 这是事故，不是统计`));
  } else {
    wrap.append(el("p", { class: "muted" }, "越界事件：0（正常）"));
  }
  if (data.events && data.events.length) {
    wrap.append(el("pre", {}, JSON.stringify(data.events, null, 2)));
  }
  return wrap;
}

const VERDICT_BADGE = {
  verified: "已确认", inconclusive: "未确认", blocked: "阻塞", not_run: "未执行", error: "错误",
};

function section(title, ...kids) {
  return el("section", { class: "card" }, el("h2", {}, title), ...kids);
}

function renderFinding(d) {
  if (!d || !d.id) {
    return el("div", {},
      el("p", {}, "未找到该发现"),
      el("p", {}, el("a", { href: "#/findings" }, "返回列表")));
  }
  const a = d.assertion || {};
  const wrap = el("div");

  if (d.selected_by === "fallback") {
    wrap.append(el("p", { class: "alert-warn" },
      `未找到 id=${d.requested}，显示第一条（fallback）`));
  }

  wrap.append(section("① 断言",
    el("p", {}, el("span", { class: "chip" }, VERDICT_BADGE[a.verdict] || a.verdict)),
    el("p", {}, `${d.id} · ${a.oracle || "-"} · ${a.asset || "-"}`),
    el("p", { class: "muted" },
      `severity: ${a.severity || "（未验证，无分档）"} · 置信度 ${Number(a.confidence || 0).toFixed(2)}`
      + (a.reason ? ` · 原因 ${a.reason}` : ""))));

  wrap.append(section("② 复现",
    el("p", { class: "muted" }, "关掉 agent，只用证据包重发三条请求："),
    el("pre", {}, d.repro || "未提供")));

  const traces = d.traces || [];
  wrap.append(section("③ 三条 trace 摘要",
    traces.length
      ? el("table", el("tr", el("th", {}, "角色"), el("th", {}, "状态"), el("th", {}, "字节数"),
          ...traces.map((x) => el("tr", el("td", {}, String(x.role || "-")),
            el("td", {}, String(x.status ?? "-")), el("td", {}, String(x.bytes ?? "-"))))))
      : el("p", { class: "muted" }, "未提供（trace 未注入）")));

  wrap.append(section("④ 路由来源",
    el("p", {}, d.bound === false
      ? el("span", { class: "muted" }, "未绑定（本轮没有解析出可用绑定）")
      : el("span", {}, d.route || "-")),
    el("p", { class: "muted" },
      `来源类别 ${d.route_source || "-"} · 只给前 8 位，任何情况下都不显示模板正文`)));

  wrap.append(section("⑤ 证据包 capsule",
    d.capsule_present
      ? el("p", {}, el("code", {}, d.capsule), " ",
          d.repro_ok
            ? el("code", {}, d.repro)
            : el("span", { class: "muted" }, "（盘上找不到这份证据）"))
      : el("p", { class: "alert-red" }, "无证据包 —— 该结论不可复现")));

  return wrap;
}

function renderError(op, status) {
  return el("div", { class: "state-error", role: "alert" },
    el("p", {}, `接口不可用：${op} 返回 ${status}`),
    el("p", { class: "muted" }, "这是环境或契约问题，不是「没有发现」。"),
    el("p", {}, el("a", { href: "#/overview" }, "回到概览")));
}

function renderApprovals(d) {
  const wrap = el("div");
  const rows = d.rows || [];
  wrap.append(el("p", { class: "muted" },
    `待批 ${d.pending || 0} 条 —— 批准/拒绝都要填理由；1h 未批自动过期（动作 BLOCKED）`));
  if (!rows.length) {
    wrap.append(el("p", { role: "status" }, "当前没有待批动作"));
    return wrap;
  }
  for (const row of rows) {
    const box = el("section", { class: "card" },
      el("h2", {}, `${row.action_class} · ${row.impact} · ${row.asset}`),
      el("p", { class: "muted" },
        `影响 ${row.requests} 个请求 · 可逆：${row.reversible ? "是" : "否"}`
        + ` · 绑定 ${row.route || "未绑定"} · 状态 ${row.status}`
        + ` · 剩余 ${row.expires_in_s}s`));
    if (row.status === "pending") {
      const reason = el("input", { type: "text", placeholder: "必填理由（进报告附录）",
                                   "aria-label": "审批理由" });
      const send = (decision) => {
        const body = { id: row.id, decision, reason: reason.value, by: "operator" };
        fetch("../../ui/approvals", { method: "POST",
          headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
          .then((resp) => resp.json().then((data) => ({ ok: resp.ok, data })))
          .then((res) => {
            if (!res.ok) window.alert(`审批失败：${res.data?.detail?.error || "unknown"}`);
            render();
          });
      };
      box.append(el("p", {}, reason,
        " ",
        el("button", { type: "button" }, "批准"),
        el("button", { type: "button" }, "拒绝")));
      const buttons = box.querySelectorAll("button");
      buttons[0].addEventListener("click", () => send("approve"));
      buttons[1].addEventListener("click", () => send("reject"));
    } else {
      box.append(el("p", {}, `决定：${row.status} · ${row.decided_by || "-"} · ${row.reason || "-"}`));
    }
    wrap.append(box);
  }
  return wrap;
}

function renderGeneric(data) {
  return el("pre", {}, JSON.stringify(data, null, 2));
}

function setHash(next, { replace = false } = {}) {
  const hash = buildHash(next);
  if (locations(hash)) return;
  if (replace) location.replace(hash);
  else location.hash = hash;
}

function locations(hash) {
  return location.hash === hash;
}

async function render() {
  state = parseHash(location.hash);
  for (const btn of nav.querySelectorAll("button")) {
    btn.setAttribute("aria-current", btn.dataset.op === state.op ? "page" : "false");
  }
  main.setAttribute("aria-busy", "true");
  main.replaceChildren(
    el("div", { role: "status" },
      el("p", { class: "muted" }, "加载中…"),
      el("div", { class: "skeleton", style: "" }),
      el("div", { class: "skeleton", style: "" })));
  const data = await fetchOp(state.op, state.params);
  main.setAttribute("aria-busy", "false");
  if (data && data.error) {
    main.replaceChildren(renderError(state.op, data.error));
    return;
  }
  lastRows = data.rows || [];
  let view;
  if (state.op === "overview") view = renderOverview(data);
  else if (state.op === "engagement") view = renderEngagement(data);
  else if (state.op === "coverage") view = renderCoverage(data);
  else if (state.op === "findings") view = renderFindings(data, state.params);
  else if (state.op === "finding") view = renderFinding(data);
  else if (state.op === "approvals") view = renderApprovals(data);
  else if (state.op === "unverified") view = renderUnverified(data);
  else if (state.op === "routes") view = renderRoutes(data);
  else if (state.op === "audit") view = renderAudit(data);
  else if (state.op === "bounds") view = renderBounds(data);
  else view = renderGeneric(data);
  main.replaceChildren(view);
}

for (const op of OPS) {
  const btn = el("button", { "data-op": op }, op);
  btn.addEventListener("click", () => setHash({ op, params: {} }));
  nav.append(btn);
}

window.addEventListener("hashchange", () => {
  // 跳过导航等页内锚点（#main）不是换页，保持当前视图
  if (!isRouteHash(location.hash)) return;
  render();
});

// 斜杠键用字符码构造：仓库的 R-PATH 闸门会把该字符的字面量当成路径片段（noroute 纪律）
const SLASH = String.fromCharCode(0x2f);

document.addEventListener("keydown", (event) => {
  if (event.key === SLASH && !(event.target instanceof HTMLInputElement)) {
    event.preventDefault();
    document.getElementById("q")?.focus();
    return;
  }
  if (event.key === "Escape") {
    if (document.activeElement instanceof HTMLInputElement) document.activeElement.blur();
    else setHash({ op: "findings", params: {} });
    return;
  }
  if (!["j", "k", "Enter"].includes(event.key)) return;
  const rows = [...main.querySelectorAll("tr[data-id]")];
  if (!rows.length) return;
  const active = rows.findIndex((tr) => tr.dataset.active === "1");
  if (event.key === "Enter") {
    if (active >= 0) setHash({ op: "finding", params: { id: rows[active].dataset.id } });
    return;
  }
  event.preventDefault();
  const next = event.key === "j"
    ? Math.min(rows.length - 1, active < 0 ? 0 : active + 1)
    : Math.max(0, active <= 0 ? 0 : active - 1);
  rows.forEach((tr) => (tr.dataset.active = "0"));
  rows[next].dataset.active = "1";
  rows[next].scrollIntoView({ block: "nearest" });
});

// 密度偏好：只影响本地视图，不写任何服务端状态（U4）
const densityBtn = document.getElementById("density");
function applyDensity(value) {
  const compact = value === "compact";
  document.body.dataset.density = compact ? "compact" : "comfortable";
  densityBtn.textContent = compact ? "密度：紧凑" : "密度：舒适";
  densityBtn.setAttribute("aria-pressed", compact ? "true" : "false");
  try { localStorage.setItem("veripen.density", compact ? "compact" : "comfortable"); } catch (_) { /* 隐私模式 */ }
}
let density = "comfortable";
try { density = localStorage.getItem("veripen.density") || "comfortable"; } catch (_) { /* 隐私模式 */ }
applyDensity(density);
densityBtn.addEventListener("click", () =>
  applyDensity(document.body.dataset.density === "compact" ? "comfortable" : "compact"));

if (!location.hash) setHash({ op: "overview", params: {} }, { replace: true });
render();
</script>
