[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hos-ares"
version = "0.1.0"
description = "HOS-ARES · VeriPen 渗透验证内核 — 可审计、可复现、可离线部署"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "pyyaml>=6.0,<7",
    "jsonschema>=4.21,<5",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "httpx>=0.27,<1",
]

[project.scripts]
veripen = "veripen_cli.main:app"

[tool.setuptools.packages.find]
include = ["veripen_core*", "veripen_oracles*", "veripen_contract*", "veripen_cli*", "api*", "worker*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "oracle: needs a live range",
    "e2e: end-to-end",
    "slow: real wall-clock wait (30s++)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
