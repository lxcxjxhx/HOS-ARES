# HOS-ARES —— 可验证渗透内核
#
# B1 只装"能跑契约测试 + 能起服务"的最小依赖；后续批次按需增加，不预装。
# 不写任何 URL（lint-noroute 全仓生效）。

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hos-ares"
version = "0.1.0"
description = "可验证渗透验证内核：判定纯函数、地址零常量、证据六态可 replay"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    # 产品代码直接 import（`hos_ares_core/playbooks.py`）：漏了它，干净安装一加载
    # 演练剧本就 ModuleNotFoundError（B200 在干净 venv 里实跑抓到）
    "jsonschema>=4.20",
]

# 安装后可直接 `hos-ares <子命令>`；未安装时用 `python -m hos_ares_cli`
[project.scripts]
hos-ares = "hos_ares_cli.__main__:main"

[project.optional-dependencies]
# cryptography 只被 tests/lab/tls.py 用来现场签发证书（https 分支的夹具）。
# 它**不进运行期依赖**：产品代码走 stdlib ssl，不需要它；
# 但测试里必须声明清楚，否则本地碰巧装了就能过、CI 干净环境就红。
# tests/routes/test_l0.py 会在子进程里跑 mypy；缺 mypy 或类型桩，CI 干净环境就红（B200）。
# playwright 是**产品代码**里的可选渲染后端（`hos_ares_core/render/browser.py` 直接 import），
# 不进运行期依赖；但 mypy 查产品代码时需要它在位，否则 import-not-found。
dev = ["pytest>=8.0", "cryptography>=42", "mypy>=1.8", "types-PyYAML>=6",
       "playwright>=1.40",
       # `fastapi.testclient` 需要它；干净环境缺了整批用例在收集期就 ERROR
       "httpx2>=0.1"]

[tool.setuptools.packages.find]
# B439：显式 packages 列表只写了顶层，**子包全丢**——`hos_ares` 下的 bench/doctor/report
# 在 wheel 里一个都没有，装上就 ImportError。改用 find + 白名单前缀：`hos_ares*` 一并覆盖
# 五个包（hos_ares / _cli / _contract / _core / _oracles）及其子包。
# 不用排除法（exclude）是因为仓库里还有 tests/ scripts/ out/ 这些不该进包的目录。
include = ["api*", "hos_ares*", "web*", "worker*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
mypy_path = ["tests", "tests/unit"]
