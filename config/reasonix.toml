# HOS-ARES 项目级 reasonix 配置模板（TOML）
# 解析优先级：flag > ./reasonix.toml > <Reasonix home>/config.toml > 内置默认值
# 密钥通过 api_key_env 从环境变量注入（如 DEEPSEEK_API_KEY），切勿在此写入明文密钥。
# 依据实测 v1.19.1 schema（见 方案/HOS-ARES-重构方案-v3.0/07-实测偏差与修正.md）。
# 本文件面向 Android/Termux 部署：MCP 服务器命令在容器内安装后生效。

config_version = 5
default_model  = "deepseek-flash"
language       = "zh"

# ---------- LLM Provider ----------
[[providers]]
name        = "deepseek-flash"
kind        = "openai"
base_url    = "https://api.deepseek.com"
models      = ["deepseek-v4-flash"]
default     = "deepseek-v4-flash"
api_key_env = "DEEPSEEK_API_KEY"
balance_url = "https://api.deepseek.com/user/balance"
context_window = 1000000
price       = { cache_hit = 0.02, input = 1, output = 2, currency = "¥" }   # 每 1M token

[[providers]]
name        = "deepseek-pro"
kind        = "openai"
base_url    = "https://api.deepseek.com"
model       = "deepseek-v4-pro"
api_key_env = "DEEPSEEK_API_KEY"
balance_url = "https://api.deepseek.com/user/balance"
context_window = 1000000
price       = { cache_hit = 0.025, input = 3, output = 6, currency = "¥" }

# ---------- Agent ----------
[agent]
temperature       = 0.0
soft_compact_ratio  = 0.5   # cache-first 前缀缓存友好
compact_ratio       = 0.8
compact_force_ratio = 0.9
recovery_model      = "deepseek-pro"          # 可选：恢复模型
# subagent_model      = "deepseek-pro"          # 子 Agent 默认模型
# max_subagent_depth = 2                        # 嵌套委托深度
# max_subagent_concurrency = 6                  # 会话级子 Agent 并发

# ---------- 权限门控（deny > ask > allow > fallback） ----------
[permissions]
mode  = "ask"
# deny  = ["Bash(rm -rf*)", "Bash(git push*)"]   # 硬禁止，任何模式生效
# allow = ["Bash(go test:*)", "Bash(git status:*)"]   # 免确认
# ask   = ["Edit(src/**)"]                          # 强制确认

# ---------- 工具 ----------
[tools]
enabled = []                    # 空 = 全部内置工具
bash_timeout_seconds = 120
mcp_call_timeout_seconds = 300

# ---------- 容器/沙箱 ----------
[sandbox]
# 文件写入工具仅允许在工作区（workspace_root）内与 allow_write 追加目录写入
# bash = "off"  # Windows 无 OS 级 Bash 沙箱；Termux/Linux 可设 "jail"
bash    = "off"
network = true

# ---------- 外部 MCP 服务器 ----------
# type: "stdio"（默认，子进程）| "http" | "sse"
# ${VAR} / ${VAR:-default} 从环境展开（command/args/env/url/headers）
# 也可用命令：reasonix mcp add <name> -- <command> [args...]（项目级写入本文件）

[[plugins]]
name    = "mobile-security"
command = "python"
args    = ["tools/mcp-compat-gw.py"]
# 依赖目录：含 mcp==1.28.1 与 mobile-security-mcp 0.1.4 的完整安装
# 适配层理由见 方案/…/12-Phase5-前置：工具调用级兼容探测.md：
#   原包 handler 为单参签名，mcp-SDK 一律双参派发 → 直连必报
#   "takes 1 positional argument but 2 were given"；网关绕过 SDK 直调。
# env: ${DEEPSEEK_API_KEY} 由 Reasonix 全局 .env 注入，无需重复声明

[[plugins]]
name    = "mcp-termux"
command = "mcp-termux"
args    = ["--port", "65534"]

[[plugins]]
name    = "jadx-headless"
command = "jadx-headless-mcp"

[[plugins]]
name    = "droid-mcp"
command = "droid-mcp"

# 远程 MCP 示例（Streamable HTTP）：
# [[plugins]]
# name = "remote-security"
# type = "http"
# url  = "https://example.com/mcp"
# headers = { Authorization = "Bearer ${REMOTE_MCP_TOKEN}" }