<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 深紫黑背景渐变 -->
    <radialGradient id="bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#1E1436"/>
      <stop offset="55%" stop-color="#0B0710"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <!-- 主紫→洋红渐变 -->
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
    <!-- 虹膜渐变（眼） -->
    <radialGradient id="iris" cx="42%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="60%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </radialGradient>
    <!-- 外发光 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 背景星点 -->
  <g fill="#A855F7" opacity="0.35">
    <circle cx="84" cy="96" r="2.4"/>
    <circle cx="428" cy="80" r="1.8"/>
    <circle cx="64" cy="352" r="1.8"/>
    <circle cx="448" cy="300" r="2.2"/>
    <circle cx="120" cy="432" r="1.5"/>
    <circle cx="392" cy="436" r="1.8"/>
  </g>

  <!-- 外环（细光圈） -->
  <circle cx="256" cy="240" r="158" fill="none" stroke="url(#brand)" stroke-width="2.5" opacity="0.55" filter="url(#soft)"/>
  <circle cx="256" cy="240" r="158" fill="none" stroke="url(#brand)" stroke-width="1.5" opacity="0.9"/>

  <!-- 盾形六边形 -->
  <path d="M256 96 L382 152 V264 C382 330 330 380 256 414 C182 380 130 330 130 264 V152 Z"
        fill="rgba(40,28,64,0.55)" stroke="url(#brand)" stroke-width="3" filter="url(#glow)"/>
  <path d="M256 96 L382 152 V264 C382 330 330 380 256 414 C182 380 130 330 130 264 V152 Z"
        fill="none" stroke="url(#brand)" stroke-width="1.2" opacity="0.6" transform="translate(0,8)"/>

  <!-- 眼睛：虹膜 -->
  <ellipse cx="256" cy="250" rx="74" ry="52" fill="url(#iris)" filter="url(#glow)"/>
  <ellipse cx="256" cy="250" rx="74" ry="52" fill="none" stroke="#C084FC" stroke-width="1.5" opacity="0.8"/>
  <!-- 瞳孔 -->
  <ellipse cx="256" cy="250" rx="30" ry="30" fill="#1B0F2E"/>
  <ellipse cx="256" cy="250" rx="30" ry="30" fill="none" stroke="#D946EF" stroke-width="1" opacity="0.7"/>
  <!-- 瞳孔渐变内圈 -->
  <circle cx="256" cy="250" r="16" fill="url(#brand)" opacity="0.9"/>
  <!-- 高光 -->
  <circle cx="282" cy="232" r="10" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="238" cy="272" r="4.5" fill="#FFFFFF" opacity="0.55"/>

  <!-- 底部字标 -->
  <text x="256" y="472" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="26" font-weight="600" letter-spacing="8" fill="url(#brand)">HOS·ARES</text>
</svg>
