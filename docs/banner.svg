<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="90%">
      <stop offset="0%" stop-color="#221647"/>
      <stop offset="55%" stop-color="#0B0710"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
    <radialGradient id="iris" cx="42%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="60%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 网格线（数据流质感） -->
  <g stroke="#3A2A5C" stroke-width="1" opacity="0.18">
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>
  <!-- 星点 -->
  <g fill="#A855F7" opacity="0.4">
    <circle cx="80" cy="90" r="2.4"/><circle cx="1120" cy="70" r="2"/>
    <circle cx="60" cy="380" r="1.8"/><circle cx="1140" cy="320" r="2.2"/>
    <circle cx="140" cy="560" r="1.6"/><circle cx="1060" cy="560" r="1.8"/>
    <circle cx="230" cy="150" r="1.5"/><circle cx="970" cy="180" r="1.5"/>
  </g>

  <!-- 中央大徽标：盾 + 眼 -->
  <g filter="url(#glow)">
    <circle cx="600" cy="270" r="130" fill="none" stroke="url(#brand)" stroke-width="2" opacity="0.5"/>
    <path d="M600 150 L700 195 V275 C700 325 662 362 600 388 C538 362 500 325 500 275 V195 Z"
          fill="rgba(40,28,64,0.6)" stroke="url(#brand)" stroke-width="3.5"/>
    <ellipse cx="600" cy="272" rx="60" ry="42" fill="url(#iris)"/>
    <ellipse cx="600" cy="272" rx="24" ry="24" fill="#1B0F2E"/>
    <circle cx="600" cy="272" r="13" fill="url(#brand)" opacity="0.9"/>
    <circle cx="621" cy="257" r="8" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="586" cy="289" r="3.6" fill="#FFFFFF" opacity="0.55"/>
  </g>

  <!-- 标题 -->
  <text x="600" y="440" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="58" font-weight="700" letter-spacing="14" fill="#FFFFFF">HOS-ARES</text>
  <text x="600" y="486" text-anchor="middle" font-family="'Consolas','Menlo',monospace"
        font-size="20" letter-spacing="10" fill="#C9B8E8" opacity="0.9">AI · SECURITY · LAB</text>
  <!-- 分割线 -->
  <rect x="480" y="504" width="240" height="2.5" rx="1.25" fill="url(#brand)"/>

  <!-- 底部小字 -->
  <text x="600" y="600" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif"
        font-size="14" letter-spacing="4" fill="#8A7BAB">DeepSeek-Reasonix · 8 SECURITY TOOLS · ARM64</text>
</svg>
