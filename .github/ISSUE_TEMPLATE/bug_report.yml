name: Bug report
description: 报告可复现的错误行为（判定、证据链、CLI、安装包）
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **安全问题不要走这里** —— 判定可被绕过、证据链可伪造、凭据泄漏，请按 [SECURITY.md](../blob/main/SECURITY.md) 走私报告。

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 预期行为与实际行为各一句。如果是判定问题，写清「输入是什么、内核给了什么结论」。
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 命令 + 输入文件（或最小片段）。能贴 `veripen doctor` 的输出更好。
      placeholder: |
        ```bash
        veripen doctor
        python -m veripen_cli ...
        ```
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: `veripen --version` 或 `git rev-parse --short HEAD`
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: 平台
      description: 操作系统、Python 版本
      placeholder: Windows 11 / Python 3.12.4
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我搜过现有 issue，没有重复
          required: true
        - label: 这不是安全问题（安全问题走 SECURITY.md）
          required: true
