# HOS-ARES Phase 5：全量 APK 打包与端到端验收（三 Job 流水线）
# 依据：方案/09-Phase3-AresGateway验收.md、10-Phase4-端到端链路接通.md、11-Phase5-APK全量打包方案.md
name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  bake-rootfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 烘烤 Alpine rootfs（reasonix + MCP 工具链）
        run: bash scripts/build-rootfs.sh
      - name: 上传 rootfs 资产
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-asset
          path: build/rootfs.tar.xz

  build-apk:
    needs: bake-rootfs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: 下载 rootfs 并注入 assets
        uses: actions/download-artifact@v4
        with: { name: rootfs-asset }
      - run: |
          mkdir -p android/app/src/main/assets
          cp build/rootfs.tar.xz android/app/src/main/assets/rootfs.tar.xz
          cp tools/proot_arm64 android/app/src/main/assets/proot_arm64 2>/dev/null || true
      - name: assembleRelease
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: hos-ares-apk
          path: android/app/build/outputs/apk/release/*.apk

  smoke-e2e:
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: hos-ares-apk }
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          script: |
            adb install -r *.apk
            adb shell am start -n com.hos.ares/.MainActivity
            sleep 20
            adb shell 'test -d /data/data/com.hos.ares/files/rootfs/usr/bin && echo ROOTFS-OK'
            adb shell 'test -x /data/data/com.hos.ares/files/rootfs/root/hos-ares/tools/mcp-compat-gw.py && echo GW-IN-ROOTFS'
            adb shell 'curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8931/?token=hos-ares-gw-token"' 2>/dev/null || true
            # 注：健康检查由应用内 ReasonixServeBootstrap 完成；此处验证 rootfs 解压产物、适配层落位与进程存活
            # 调用级断言（12 文实测闭环）：rootfs 内发起 reasonix 会话并调用 check_tools，
            # 断言事件流出现 tool_dispatch/tool_result 帧且 Agent 正常收尾（turn_done）
            adb shell 'cd /data/data/com.hos.ares/files/rootfs/root/hos-ares && REASONIX_HOME=/data/data/com.hos.ares/files/rootfs/etc/reasonix HOS_ARES_PYTHONPATH=/opt/ares-libs reasonix -p "调用 mobile-security 的 check_tools 并只回复 GW-OK" --model deepseek-v4-flash --output-format stream-json 2>&1 | grep -c tool_dispatch && echo GW-DISPATCH-OK'
            adb shell 'pidof -s com.hos.ares > /dev/null && echo APP-ALIVE'