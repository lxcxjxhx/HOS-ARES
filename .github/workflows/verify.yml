name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Contract tests (architecture must not drift)
        run: python -m pytest tests/unit/test_contracts.py -v

      - name: Unit tests
        run: python -m pytest tests/unit -q

      - name: Lint — no customer leak in core/oracles (A2)
        run: python scripts/lint_noleak.py

      - name: Lint — no mock data (26)
        run: python scripts/lint_nodata_stub.py

      - name: Batch ledger must parse
        run: python scripts/batch_ledger.py status

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: End-to-end (real kill -9 lease takeover, ~32s)
        run: |
          if [ -d tests/e2e ]; then
            python -m pytest tests/e2e -q
          else
            echo "tests/e2e absent on this branch — skipping"
          fi

      # 全量跑一遍：任何"本机 pip install 过但没登记进 pyproject"的依赖都会在这里暴露，
      # 而不是等到部署才炸（B4 的 typer 就是活例：本地绿、CI 红）。
      - name: Full suite under declared dependencies only
        run: python -m pytest tests -q
