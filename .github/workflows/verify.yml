name: verify

# 全绿才算过。清单在 `scripts/verify.py`：本地 `python scripts/verify.py` 与这里
# 调用的是**同一份定义**——避免"CI 跑的"和"本地跑的"不是同一串命令。
#
# 两个 job：
# * gates（ubuntu，约 1 分钟）：mypy + 六道 lint + 账本 + 计划结构；
# * tests（windows，分段）：单元 / 集成 / 其余三段落开跑，
#   本机单进程全量约 30 分钟，分段才能在超时前拿到结论。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装
        run: |
          python -m pip install --upgrade pip
          # 只用项目自己声明的 extras：手写清单一定会漏（CI 实跑漏过 types-PyYAML 与 playwright）
          python -m pip install -e ".[dev]"
      - name: 跑闸门（skip 不算通过：退出码 2 视为失败）
        run: |
          python scripts/verify.py
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "verify 退出码 $code（0=全绿 / 1=有失败 / 2=有跳过）"
            exit 1
          fi

  tests:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        chunk:
          - unit
          - integration
          - rest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装
        run: |
          python -m pip install --upgrade pip
          # 用项目自己声明的 extras：test 需要的 cryptography 之类在 dev 里，
          # 手写清单一定会漏（CI 第一次跑就漏了 httpx 与 cryptography）
          python -m pip install -e ".[dev]"
      - name: 跑测试（分段）
        shell: pwsh
        run: |
          $map = @{ "unit" = "tests-unit"; "integration" = "tests-integration"; "rest" = "tests-rest" }
          python scripts/verify.py --with-tests --only $($map["${{ matrix.chunk }}"])
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "== 完整输出（每道闸门一份，日志被截断时看这里）=="
            Get-ChildItem out/verify -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "---- $($_.Name) ----"
              Get-Content $_.FullName -Tail 60
            }
            throw "verify 退出码 $code（0=全绿 / 1=有失败 / 2=有跳过）"
          }
